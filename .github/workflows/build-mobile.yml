name: Build Mobile APK

on:
  push:
    branches: [main]
    paths:
      - "mobile/inventario_app/**"
      - ".github/workflows/build-mobile.yml"
  pull_request:
    branches: [main]
    paths:
      - "mobile/inventario_app/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile/inventario_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29"
          channel: stable

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            mobile/inventario_app/.dart_tool
            mobile/inventario_app/.packages
            mobile/inventario_app/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('mobile/inventario_app/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Upload APK (arm64-v8a)
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-v8a-release
          path: mobile/inventario_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Upload APK (armeabi-v7a)
        uses: actions/upload-artifact@v4
        with:
          name: app-armeabi-v7a-release
          path: mobile/inventario_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk

      - name: Upload APK (x86_64)
        uses: actions/upload-artifact@v4
        with:
          name: app-x86_64-release
          path: mobile/inventario_app/build/app/outputs/flutter-apk/app-x86_64-release.apk
