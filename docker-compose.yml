version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: inventario_db
    environment:
      POSTGRES_USER: zoom_user
      POSTGRES_PASSWORD: zoom_password
      POSTGRES_DB: inventario_zoom
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zoom_user -d inventario_zoom"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: inventario_backend
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: zoom_user
      DB_PASSWORD: zoom_password
      DB_NAME: inventario_zoom
      SECRET_KEY: cambiar_esta_clave_en_produccion
    volumes:
      - ./backend/app/models:/app/app/models

volumes:
  pgdata:
